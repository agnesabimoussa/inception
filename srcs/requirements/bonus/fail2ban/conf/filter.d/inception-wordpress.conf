# A failed WordPress login shows the form again (200); a successful one redirects (302).
# xmlrpc.php is a classic brute-force path and is not used by this site.
# An optional query string (/wp-login.php?x=1) must not bypass the filter.
# fail2ban removes the date before matching, hence the empty [] in nginx lines.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "POST /(wp-login|xmlrpc)\.php(\?\S*)? HTTP/[\d.]+" 200
ignoreregex =
