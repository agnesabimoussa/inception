# Instead of a firewall rule, write banned IPs to a file in the shared "bans"
# volume. nginx reads it (conf/banlist.js) and answers 403 to these IPs.
# One file per jail, so starting one jail never wipes another jail's bans.
[Definition]
# fail2ban runs with umask 077: make the list readable by nginx's worker
actionstart = : > <banfile>; chmod 644 <banfile>
actionstop  = : > <banfile>
actioncheck =
actionban   = echo '<ip>' >> <banfile>
# Exact-line delete; cat keeps the same file instead of replacing it
actionunban = grep -vxF '<ip>' <banfile> > <banfile>.tmp; cat <banfile>.tmp > <banfile>; rm -f <banfile>.tmp

[Init]
name    = default
banfile = /var/lib/inception-bans/<name>.list
