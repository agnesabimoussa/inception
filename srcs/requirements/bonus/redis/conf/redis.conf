# Redis as a pure cache for WordPress (bonus)
# The port is not set here: entrypoint.sh passes --port from REDIS_PORT (.env)

# Listen on the docker network; a password is required (see include below)
bind 0.0.0.0
protected-mode yes

# Stay in the foreground and log to the container output
daemonize no
logfile ""

# Cache only: limited memory, evict the least recently used keys when full
maxmemory 128mb
maxmemory-policy allkeys-lru

# No persistence: nothing is written to disk, so no volume is needed
save ""
appendonly no
dir /tmp

# Written by entrypoint.sh from the redis_password secret
include /run/redis/auth.conf
