[global]
; Send php-fpm's own logs to the container output (docker logs)
error_log = /proc/self/fd/2

[www]
user = nobody
group = nobody

; Listen on all interfaces so nginx can reach php-fpm over the docker network.
; ${ADMINER_PORT} is read from the environment (.env) when php-fpm starts.
listen = ${ADMINER_PORT}

; Adminer is a light admin tool: a small pool is enough
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; Show PHP errors from the workers in docker logs
catch_workers_output = yes
decorate_workers_output = no
